  /ocr-records/{ocrRecordId}/confirmation:
    post:
      tags:
      - OCR
      operationId: confirmOcrRecord
      summary: Verify extracted invoice data before it updates inventory/supplier due (FR-OCR-03)
      description: |
        CONFIRM creates one PURCHASE transaction, adds the stock and raises the supplier due by `total - paid_amount`. REJECT creates nothing. Every line must be mapped to a product (`product_id`).

        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | corrected_data replaces the OCR values entirely; without it the OCR values are used; REJECT returns transaction null and sets ocr_status REJECTED; a purchase can be fully unpaid (paid_amount 0) | 200 | - |
        | Missing, malformed, expired or revoked bearer token | 400 | `AUTH_REQUIRED` |
        | Path resource does not exist, or belongs to another shop/user (same answer for both, prevents ID probing) | 400 | `RESOURCE_NOT_FOUND` |
        | Body empty, truncated or not valid JSON | 400 | `INVALID_JSON` |
        | Content-Type is not application/json | 400 | `UNSUPPORTED_CONTENT_TYPE` |
        | Path id or query id is not a valid UUID | 422 | `VALIDATION_ERROR` |
        | Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid | 422 | `VALIDATION_ERROR` |
        | Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id) | 422 | `UNKNOWN_FIELD` |
        | ocr_status is PROCESSING or FAILED | 422 | `OCR_NOT_READY` |
        | Record was already CONFIRMED or REJECTED (details.transaction_id): no duplicate purchase is created | 422 | `ALREADY_DECIDED` |
        | CONFIRM without supplier_id when supplier_name matched no (or several) suppliers | 422 | `SUPPLIER_REQUIRED` |
        | supplier_id missing, inactive, or in another shop | 422 | `INVALID_SUPPLIER` |
        | CONFIRM while one or more lines have no product_id | 422 | `PRODUCT_MAPPING_REQUIRED` |
