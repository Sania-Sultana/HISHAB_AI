      summary: Upload a Bangla voice recording to start the extraction pipeline (FR-TRANS-01)
      description: |
        **Limits:** max **10 MB**, duration **0.5-60 s**, formats wav/mp3/m4a/ogg/webm (verified by signature), exactly one `audio` part. Returns 200 with `status=UPLOADED`; poll `GET /voice-inputs/{id}`. Silence, no transaction found, or a provider outage appear later as `status=FAILED` with `failure_code`.

        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | Retrying the same upload creates a second voice input: the client must not auto-retry after a timeout without first checking its list, or should use offline sync (idempotent by local_record_id) | 200 | - |
