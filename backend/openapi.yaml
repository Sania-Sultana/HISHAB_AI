openapi: 3.0.3
info:
  title: HishabAI API
  version: 1.2.0
  contact:
    name: HishabAI Team
    email: dev@hishabai.com
  description: |
    REST API for HishabAI: voice/OCR-driven shop bookkeeping for Bangladeshi merchants.

    ## Locked HTTP status codes
    Every operation returns **only 200, 400, 422 or 500**.

    | Code | Meaning in this API |
    |---|---|
    | 200 | Success. Also used for creates (was 201), accepted async jobs (was 202), idempotent replays and "processed but needs review" |
    | 400 | Request cannot be accepted as sent: malformed JSON, wrong Content-Type, missing/invalid token, bad credentials, path resource missing or not yours, empty/corrupt/oversized/unsupported upload |
    | 422 | Request is well-formed but fails schema or business-rule validation: field format/range, cross-field rules, insufficient stock, duplicates, duration/resolution limits, invalid state |
    | 500 | Unexpected server or upstream (STT / OCR / LLM / SMS) failure. Nothing is saved. Safe to retry when `retryable=true` |

    Status codes 201, 202, 401, 403, 404, 409, 413 and 429 are **not used**. Their situations map to 200/400/422 plus a stable `code` (see every operation's edge-case table). Clients must branch on `code`, not only on the status.

    ## Limits (locked)
    | Input | Limit |
    |---|---|
    | Audio upload (`/voice-inputs`) | max **10 MB** (10,485,760 bytes; exactly 10 MB accepted), duration **0.5-60 s**, formats wav / mp3 / m4a / ogg / webm (checked by file signature, not by extension or MIME), exactly one `audio` part |
    | Image upload (`/ocr-records`) | max **5 MB** (5,242,880 bytes), formats jpg / jpeg / png / webp, **480x480 to 8000x8000 px**, exactly one `image` part |
    | JSON body | max 1 MB |
    | Offline sync batch | 1-500 records |
    | Transaction items | 1-100 lines |
    | Page size | 1-100 (default 20) |
    | Date range on reports/lists | max 366 days |

    ## Conventions
    - Money: JSON number, max 2 decimals (`multipleOf 0.01`), up to 99,999,999.99 BDT. Quantity: max 3 decimals, up to 9,999,999.999. Stock is never negative.
    - Mobile: local 11-digit `01[3-9]XXXXXXXX`. Only `/auth/login` also accepts `+880`/`880` prefixes. Bangla digits are rejected everywhere.
    - Text is UTF-8 (Bangla + English), trimmed; a value that is blank after trimming is treated as missing. Passwords are never trimmed.
    - Dates are ISO-8601; date-only filters use Asia/Dhaka (UTC+6).
    - Unknown or read-only JSON properties are rejected (422 `UNKNOWN_FIELD`).
    - `PUT` is a full replacement: omitted optional fields are cleared.
    - A resource id in the path that does not exist **or** belongs to another user/shop returns the same 400 `RESOURCE_NOT_FOUND`.
    - AI outputs (voice, OCR) are suggestions; nothing reaches the ledger until the user confirms (FR-TRANS-06, FR-OCR-03).
    - Every error body carries `request_id`; 500s add `retryable`.

    ## Changes made while cross-checking the previous spec (v1.0.0)
    1. Status codes locked to 200/400/422/500 on every operation; 401/404 removed.
    2. Added `additionalProperties: false`, min/max lengths, money/quantity precision and enums to every request schema.
    3. `format: decimal` (not a valid OpenAPI format) replaced by numeric constraints.
    4. Supplier `PUT` reused the create schema, so `is_active` could not be changed; added `SupplierUpdateRequest`.
    5. `POST /ocr-records/{id}/confirmation` returned a `Transaction` even for REJECT; now returns `OcrConfirmationResult` (transaction null on REJECT).
    6. OCR items had no `product_id`, so inventory could not be updated; added `product_id` (required on CONFIRM) plus `paid_amount` / `payment_method` for the purchase.
    7. Sync batch had no `shop_id`; added, wrapped in `SyncBatchRequest`, and results wrapped in `SyncBatchResponse`.
    8. Voice confirmation now requires `acknowledge_low_confidence` to confirm a low-confidence extraction (FR-TRANS-06).
    9. Async voice/OCR failures are exposed as `failure_code` on the record instead of an HTTP error.
    10. Added `stock_after`, `status`, `idempotent_replay`, `warnings`, `has_next` where needed for the edge cases.
    11. Idempotency-Key also accepted on inventory adjustments, due adjustments and sync.

    ## Open points to confirm with the SRS owner
    - There is no `POST /auth/refresh` although login returns a `refresh_token`.
    - `POST /shops/{id}/transactions` (CUSTOMER_PAYMENT / SUPPLIER_PAYMENT) and `POST /shops/{id}/payments` both record payments; decide the single source of truth.
    - Product `category` enum is grocery-only while shop `business_type` allows pharmacy, clothing, electronics, restaurant.
    - Lists of inventory movements, price history, notifications and sync conflicts return bare arrays (no total); consider the same envelope as the other lists.
