  /shops/{shopId}/reports/profit-loss:
    get:
      tags:
      - CashFlow
      operationId: getProfitLoss
      summary: Profit & loss summary (FR-FIN-03)
      description: |
        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | Period without data: all zeros; net_profit may be negative (loss); cancelled transactions excluded; COGS uses the purchase price recorded at sale time | 200 | - |
        | Missing, malformed, expired or revoked bearer token | 400 | `AUTH_REQUIRED` |
        | Path resource does not exist, or belongs to another shop/user (same answer for both, prevents ID probing) | 400 | `RESOURCE_NOT_FOUND` |
        | Path id or query id is not a valid UUID | 422 | `VALIDATION_ERROR` |
        | date_from is after date_to | 422 | `DATE_RANGE_INVALID` |
        | Date range longer than 366 days | 422 | `DATE_RANGE_TOO_LARGE` |
        | date_from or date_to missing (both are mandatory for this report) | 422 | `DATE_RANGE_REQUIRED` |
        | date_from is after today (a date_to in the future is clamped to today) | 422 | `DATE_IN_FUTURE` |
        | Unexpected server error; nothing was saved (retryable=true) | 500 | `INTERNAL_ERROR` |
      parameters:
      - $ref: '#/components/parameters/ShopId'
      - $ref: '#/components/parameters/DateFrom'
      - $ref: '#/components/parameters/DateTo'
      responses:
        '200':
          description: Success (see 200 rows above for special outcomes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitLossReport'
        '400':
          description: 'Request rejected: cannot be accepted as sent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AUTH_REQUIRED:
                  summary: Missing, malformed, expired or revoked bearer token
                  value:
                    code: AUTH_REQUIRED
                    message: Missing, malformed, expired or revoked bearer token
                    request_id: req_378
                RESOURCE_NOT_FOUND:
                  summary: Path resource does not exist, or belongs to another shop/user (same answer for both, prevents ID probing)
                  value:
                    code: RESOURCE_NOT_FOUND
                    message: Path resource does not exist, or belongs to another shop/user (same answer for both, prevents ID probing)
                    request_id: req_379
        '422':
          description: Well-formed but failed validation or a business rule; nothing is saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: Path id or query id is not a valid UUID
                  value:
                    code: VALIDATION_ERROR
                    message: Path id or query id is not a valid UUID
                    request_id: req_380
                DATE_RANGE_INVALID:
                  summary: date_from is after date_to
                  value:
                    code: DATE_RANGE_INVALID
                    message: date_from is after date_to
                    request_id: req_381
                DATE_RANGE_TOO_LARGE:
                  summary: Date range longer than 366 days
                  value:
                    code: DATE_RANGE_TOO_LARGE
                    message: Date range longer than 366 days
                    request_id: req_382
                DATE_RANGE_REQUIRED:
                  summary: date_from or date_to missing (both are mandatory for this report)
                  value:
                    code: DATE_RANGE_REQUIRED
                    message: date_from or date_to missing (both are mandatory for this report)
                    request_id: req_383
                DATE_IN_FUTURE:
                  summary: date_from is after today (a date_to in the future is clamped to today)
                  value:
                    code: DATE_IN_FUTURE
                    message: date_from is after today (a date_to in the future is clamped to today)
                    request_id: req_384
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'All endpoints except /auth/register, /auth/login and /auth/password-reset/* require `Authorization: Bearer <token>`. A missing/invalid/expired token returns 400 AUTH_REQUIRED (401 is
        not used).'
  parameters:
    ShopId:
      name: shopId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    DateFrom:
      name: date_from
      in: query
      schema:
        type: string
        format: date
      description: Inclusive. Interpreted in Asia/Dhaka (UTC+6).
    DateTo:
      name: date_to
      in: query
      schema:
        type: string
        format: date
      description: Inclusive (whole day). Only one bound = open-ended range.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID, remembered for 24 h. Strongly recommended so a retried request (flaky mobile network) cannot create a duplicate. Same key + same body returns the original result;
        same key + different body is 422 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        format: uuid
  responses:
    InternalServerError:
      description: Unexpected server or upstream failure. Nothing was saved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            INTERNAL_ERROR:
              value:
                code: INTERNAL_ERROR
                message: Something went wrong. Please try again.
                retryable: true
                request_id: req_900
            UPSTREAM_UNAVAILABLE:
              value:
                code: UPSTREAM_UNAVAILABLE
                message: The AI/SMS service is temporarily unavailable.
                retryable: true
                request_id: req_901
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Stable machine-readable code (see the edge-case table of each operation)
        message:
          type: string
          description: Human-readable, safe to show to the user
        details:
          type: object
          additionalProperties: true
          description: 'Optional field-level map, e.g. {"mobile": "invalid format"}'
        retryable:
          type: boolean
          description: Present on 500
        request_id:
          type: string
    Warning:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        line_index:
          type: integer
          minimum: 0
          nullable: true
    Money:
      type: number
      multipleOf: 0.01
      minimum: 0
      maximum: 99999999.99
    MoneyPositive:
      type: number
      multipleOf: 0.01
      minimum: 0.01
      maximum: 99999999.99
    Quantity:
      type: number
      multipleOf: 0.001
      minimum: 0.001
      maximum: 9999999.999
    StockQty:
      type: number
      multipleOf: 0.001
      minimum: 0
      maximum: 9999999.999
    StockDelta:
      type: number
      multipleOf: 0.001
      minimum: -9999999.999
      maximum: 9999999.999
      description: Signed delta, must not be 0 (422 QUANTITY_INVALID)
    Mobile:
      type: string
      pattern: ^01[3-9]\d{8}$
      description: Local 11-digit format. +880/880 prefixes, spaces, hyphens and Bangla digits are rejected (422 MOBILE_INVALID)
    Uuid:
      type: string
      format: uuid
    PaymentMethod:
      type: string
      enum:
      - CASH
      - BANK_TRANSFER
      - MOBILE_BANKING
      - OTHER
      nullable: true
    Unit:
      type: string
      enum:
      - piece
      - kg
      - gram
      - liter
      - ml
      - bag
      - bottle
      - box
      - packet
    TransactionType:
      type: string
      enum:
      - SALE
      - PURCHASE
      - EXPENSE
      - CUSTOMER_PAYMENT
      - SUPPLIER_PAYMENT
    Category:
      type: string
      enum:
      - RICE
      - OIL
      - SPICES
      - BEVERAGES
      - SNACKS
      - GROCERY
      - OTHER
    RegisterRequest:
      type: object
      required:
