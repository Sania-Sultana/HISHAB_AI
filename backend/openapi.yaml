                    request_id: req_032
                MOBILE_INVALID:
                  summary: Mobile not 01[3-9]XXXXXXXX (Bangla digits, +880 prefix, spaces, hyphens rejected)
                  value:
                    code: MOBILE_INVALID
                    message: Mobile not 01[3-9]XXXXXXXX (Bangla digits, +880 prefix, spaces, hyphens rejected)
                    request_id: req_033
                PASSWORD_LENGTH:
                  summary: Password shorter than 8 or longer than 128 characters
                  value:
                    code: PASSWORD_LENGTH
