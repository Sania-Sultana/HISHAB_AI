        | File larger than 5 MB (exactly 5 MB accepted); 413 is not used | 400 | `IMAGE_TOO_LARGE` |
        | PDF, HEIC, GIF, animated WebP, SVG, or extension/MIME not matching the signature | 400 | `IMAGE_FORMAT_UNSUPPORTED` |
        | Truncated or undecodable image | 400 | `IMAGE_CORRUPT` |
        | Path id or query id is not a valid UUID | 422 | `VALIDATION_ERROR` |
        | Below 480x480 or above 8000x8000 px | 422 | `IMAGE_RESOLUTION_INVALID` |
        | Shop is deactivated; writes are blocked | 422 | `SHOP_INACTIVE` |
