    get:
      tags:
      - Voice
      operationId: getVoiceInput
      summary: Get voice input status, transcription, and AI-extracted data
      description: |
        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | UPLOADED / TRANSCRIBING / PROCESSING: transcription and ai_processing are null or partial, poll again (suggested every 2 s, stop after 60 s) | 200 | - |
        | AWAITING_CONFIRMATION: extracted_json + confidence_score + requires_review + missing_fields + customer_candidates + warnings are filled | 200 | - |
        | FAILED: failure_code is NO_SPEECH_DETECTED / NO_TRANSACTION_FOUND / AUDIO_UNDECODABLE / UPSTREAM_UNAVAILABLE and the user should re-record | 200 | - |
        | Confidence < 0.70, a null required field, ambiguous customer name, unknown product, spoken total != quantity x price, or paid > total: requires_review=true with matching warnings; nothing is auto-saved | 200 | - |
        | Bangla numerals and number words are normalised to numbers; mixed Bangla-English speech is transcribed as spoken; several transactions in one recording: only the first is extracted and warning MULTIPLE_TRANSACTIONS_DETECTED is set | 200 | - |
        | CONFIRMED / REJECTED are terminal states | 200 | - |
