  /auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Invalidate the current session/token (FR-AUTH-04)
      description: |
        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | Access and refresh token revoked. Calling again with the same token returns 400 AUTH_REQUIRED (token already revoked) | 200 | - |
        | Works while offline-queued records exist: unsynced local data is not deleted server-side | 200 | - |
        | Missing, malformed, expired or revoked bearer token | 400 | `AUTH_REQUIRED` |
        | Unexpected server error; nothing was saved (retryable=true) | 500 | `INTERNAL_ERROR` |
      responses:
        '200':
          description: Success (see 200 rows above for special outcomes)
        '400':
          description: 'Request rejected: cannot be accepted as sent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AUTH_REQUIRED:
                  summary: Missing, malformed, expired or revoked bearer token
                  value:
                    code: AUTH_REQUIRED
                    message: Missing, malformed, expired or revoked bearer token
                    request_id: req_037
        '422':
          description: Well-formed but failed validation or a business rule; nothing is saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples: {}
        '500':
          $ref: '#/components/responses/InternalServerError'
  /shops:
    post:
      tags:
      - Shop
      operationId: createShop
      summary: Create the merchant's shop profile (FR-SHOP-01)
      description: |
        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | Optional email/description/logo_path may be omitted or null; strings trimmed; Bangla shop names accepted | 200 | - |
        | Missing, malformed, expired or revoked bearer token | 400 | `AUTH_REQUIRED` |
        | Body empty, truncated or not valid JSON | 400 | `INVALID_JSON` |
        | Content-Type is not application/json | 400 | `UNSUPPORTED_CONTENT_TYPE` |
        | Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid | 422 | `VALIDATION_ERROR` |
        | Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id) | 422 | `UNKNOWN_FIELD` |
        | User already owns a shop (one shop per merchant in this version) | 422 | `SHOP_ALREADY_EXISTS` |
        | Mobile not 01[3-9]XXXXXXXX (Bangla digits, +880 prefix, spaces, hyphens rejected) | 422 | `MOBILE_INVALID` |
        | Email malformed or longer than 254 characters | 422 | `EMAIL_INVALID` |
        | Unexpected server error; nothing was saved (retryable=true) | 500 | `INTERNAL_ERROR` |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShopCreateRequest'
      responses:
        '200':
          description: Success (see 200 rows above for special outcomes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shop'
        '400':
          description: 'Request rejected: cannot be accepted as sent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AUTH_REQUIRED:
                  summary: Missing, malformed, expired or revoked bearer token
                  value:
                    code: AUTH_REQUIRED
                    message: Missing, malformed, expired or revoked bearer token
                    request_id: req_038
