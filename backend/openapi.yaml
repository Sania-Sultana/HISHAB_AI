          - $ref: '#/components/schemas/Transaction'
          nullable: true
          description: null when action=REJECT
    SyncBatchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SyncResult'
        synced:
          type: integer
        failed:
          type: integer
