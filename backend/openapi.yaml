      summary: Upload a supplier invoice/receipt image for OCR extraction (FR-OCR-01)
      description: |
        **Limits:** max **5 MB**, formats jpg/jpeg/png/webp (verified by signature), **480x480 to 8000x8000 px**, exactly one `image` part. Returns 200 with `ocr_status=PROCESSING`; poll `GET /ocr-records/{id}`.

        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | EXIF-rotated/sideways photos are auto-corrected; a blank, non-slip or unreadable image is reported later as ocr_status=FAILED with failure_code | 200 | - |
        | Missing, malformed, expired or revoked bearer token | 400 | `AUTH_REQUIRED` |
        | Path resource does not exist, or belongs to another shop/user (same answer for both, prevents ID probing) | 400 | `RESOURCE_NOT_FOUND` |
