        | File larger than 10 MB (exactly 10 MB is accepted); 413 is not used | 400 | `AUDIO_TOO_LARGE` |
        | Format not in the allow-list (aac, flac, video, PDF...) or extension/MIME does not match the file signature | 400 | `AUDIO_FORMAT_UNSUPPORTED` |
