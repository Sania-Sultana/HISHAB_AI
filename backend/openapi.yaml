  /sync/offline-records:
    post:
      tags:
      - Sync
      operationId: syncOfflineRecords
      summary: Upload a batch of locally-stored records once connectivity returns (FR-SYNC-03, SYNC-01..04)
      description: |
        `local_record_id` is the idempotency key (SYNC-05): resubmitting an already-synced record returns its original result, never a duplicate. Whole-batch problems are 400/422; per-record problems are reported inside a **200** (`sync_status=FAILED` + `conflict`).

        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | Mixed outcomes in one response: each record is SYNCED or FAILED independently; one bad record never blocks the others | 200 | - |
        | Records are applied in created_offline_at order so stock and dues come out as they would have online | 200 | - |
        | Already-synced local_record_id: replayed=true with the original server_record_id (SYNC-05); the same id twice inside one batch: the second is replayed | 200 | - |
        | FAILED + conflict DUPLICATE_RECORD when the payload duplicates an existing transaction under another id | 200 | - |
        | FAILED + conflict INSUFFICIENT_STOCK / INVALID_CUSTOMER / INVALID_PRODUCT when master data changed while offline (PENDING_REVIEW; stock is never driven negative) | 200 | - |
        | FAILED + conflict INVALID_DATA when payload_json fails the same validation as the online endpoint, or created_offline_at is in the future or older than 90 days | 200 | - |
        | FAILED + conflict SERVER_ERROR for a transient failure on one record; the client may resend it with the same local_record_id | 200 | - |
        | Missing, malformed, expired or revoked bearer token | 400 | `AUTH_REQUIRED` |
        | Body empty, truncated or not valid JSON | 400 | `INVALID_JSON` |
        | Content-Type is not application/json | 400 | `UNSUPPORTED_CONTENT_TYPE` |
        | shop_id does not belong to the caller | 400 | `SHOP_ACCESS_DENIED` |
        | Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid | 422 | `VALIDATION_ERROR` |
        | Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id) | 422 | `UNKNOWN_FIELD` |
        | records is an empty array | 422 | `BATCH_EMPTY` |
        | More than 500 records (send several batches) | 422 | `BATCH_TOO_LARGE` |
        | A record lacks local_record_id / data_type / payload_json / created_offline_at, or local_record_id is not a UUID | 422 | `VALIDATION_ERROR` |
        | Database unavailable; the whole batch is rolled back and can be resent unchanged | 500 | `UPSTREAM_UNAVAILABLE` |
        | Unexpected server error; nothing was saved (retryable=true) | 500 | `INTERNAL_ERROR` |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncBatchRequest'
      responses:
        '200':
          description: Success (see 200 rows above for special outcomes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncBatchResponse'
        '400':
          description: 'Request rejected: cannot be accepted as sent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                AUTH_REQUIRED:
                  summary: Missing, malformed, expired or revoked bearer token
                  value:
                    code: AUTH_REQUIRED
                    message: Missing, malformed, expired or revoked bearer token
                    request_id: req_349
                INVALID_JSON:
                  summary: Body empty, truncated or not valid JSON
                  value:
                    code: INVALID_JSON
                    message: Body empty, truncated or not valid JSON
                    request_id: req_350
                UNSUPPORTED_CONTENT_TYPE:
                  summary: Content-Type is not application/json
                  value:
                    code: UNSUPPORTED_CONTENT_TYPE
                    message: Content-Type is not application/json
                    request_id: req_351
                SHOP_ACCESS_DENIED:
                  summary: shop_id does not belong to the caller
                  value:
                    code: SHOP_ACCESS_DENIED
                    message: shop_id does not belong to the caller
                    request_id: req_352
        '422':
          description: Well-formed but failed validation or a business rule; nothing is saved
