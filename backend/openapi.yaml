  /ai-processing/{aiProcessingId}/confirmation:
    post:
      tags:
      - Voice
      operationId: confirmAiExtraction
      summary: Confirm, edit, or reject AI-extracted transaction data before it is saved (FR-TRANS-01, FR-TRANS-06)
      description: |
        CONFIRMED/EDITED creates the transaction (all POST /transactions rules apply); REJECTED does not. A second decision on the same extraction is refused.

        ### Rules per transaction_type
        | Type | `items` | `customer_id` | `supplier_id` | Payment rule |
        |---|---|---|---|---|
        | SALE | 1-100 lines required | optional (walk-in); **required if paid < total** | must be null | 0 <= paid <= total |
        | PURCHASE | 1-100 lines required | must be null | optional; **required if paid < total** | 0 <= paid <= total |
        | EXPENSE | must be omitted/empty | must be null | must be null | paid = total (no credit) |
        | CUSTOMER_PAYMENT | omitted | **required** | must be null | paid = total, <= customer's outstanding due |
        | SUPPLIER_PAYMENT | omitted | must be null | **required** | paid = total, <= supplier's outstanding due |

        Stock, ledgers and dues are updated in one DB transaction; on any failure nothing is written.

        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | Selling price below purchase price: allowed, warning SOLD_BELOW_COST | 200 | - |
        | REJECTED: resulting_transaction_id is null, voice input status becomes REJECTED; EDITED: edited_data replaces the AI values entirely and the edit is stored for audit | 200 | - |
        | Missing, malformed, expired or revoked bearer token | 400 | `AUTH_REQUIRED` |
        | Path resource does not exist, or belongs to another shop/user (same answer for both, prevents ID probing) | 400 | `RESOURCE_NOT_FOUND` |
        | Body empty, truncated or not valid JSON | 400 | `INVALID_JSON` |
        | Content-Type is not application/json | 400 | `UNSUPPORTED_CONTENT_TYPE` |
        | Path id or query id is not a valid UUID | 422 | `VALIDATION_ERROR` |
        | Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid | 422 | `VALIDATION_ERROR` |
        | Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id) | 422 | `UNKNOWN_FIELD` |
        | processing_status is not COMPLETED (still PROCESSING or FAILED) | 422 | `PROCESSING_NOT_READY` |
        | Extraction was already CONFIRMED/EDITED/REJECTED (details.confirmation_id, resulting_transaction_id), so double-tap creates no duplicate | 422 | `ALREADY_DECIDED` |
        | confirmation_status=EDITED without edited_data | 422 | `EDITED_DATA_REQUIRED` |
        | edited_data sent with CONFIRMED or REJECTED | 422 | `EDITED_DATA_NOT_ALLOWED` |
        | CONFIRMED while requires_review=true and acknowledge_low_confidence is not true (FR-TRANS-06) | 422 | `LOW_CONFIDENCE_ACK_REQUIRED` |
        | CONFIRMED although extracted_json still has a null required field (e.g. price): use EDITED (details.missing_fields) | 422 | `MISSING_REQUIRED_FIELDS` |
        | Several customers match the spoken name and edited_data.customer_id is not set | 422 | `CUSTOMER_AMBIGUOUS` |
        | Amount negative, total_amount = 0, more than 2 decimals, or above 99,999,999.99 | 422 | `AMOUNT_INVALID` |
        | Quantity <= 0, more than 3 decimals, or above 9,999,999.999 | 422 | `QUANTITY_INVALID` |
        | paid_amount is greater than total_amount | 422 | `PAID_EXCEEDS_TOTAL` |
        | total_amount differs from the sum of quantity x unit_price (tolerance 0.01) | 422 | `TOTAL_MISMATCH` |
        | SALE/PURCHASE without items | 422 | `ITEMS_REQUIRED` |
        | EXPENSE or payment type with items | 422 | `ITEMS_NOT_ALLOWED` |
        | More than 100 items | 422 | `TOO_MANY_ITEMS` |
        | Same product_id on two lines | 422 | `DUPLICATE_ITEM` |
        | Credit sale without customer_id, credit purchase without supplier_id, payment without its party | 422 | `PARTY_REQUIRED` |
        | customer_id/supplier_id supplied where the type forbids it | 422 | `PARTY_NOT_ALLOWED` |
        | Customer does not exist, is inactive, or belongs to another shop | 422 | `INVALID_CUSTOMER` |
        | Supplier does not exist, is inactive, or belongs to another shop | 422 | `INVALID_SUPPLIER` |
        | Product does not exist, is inactive, or belongs to another shop | 422 | `INVALID_PRODUCT` |
        | SALE quantity above current_stock, also under concurrent sales (details: product_id, available, requested) | 422 | `INSUFFICIENT_STOCK` |
        | Payment greater than the party outstanding due | 422 | `PAYMENT_EXCEEDS_DUE` |
        | transaction_date more than 5 minutes in the future or older than 365 days | 422 | `DATE_OUT_OF_RANGE` |
        | paid_amount > 0 without payment_method | 422 | `PAYMENT_METHOD_REQUIRED` |
        | Shop is deactivated; writes are blocked | 422 | `SHOP_INACTIVE` |
        | Unexpected server error; nothing was saved (retryable=true) | 500 | `INTERNAL_ERROR` |
