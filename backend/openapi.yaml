security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Register a new merchant account (FR-AUTH-01)
      description: |
        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | full_name in Bangla/English/spaces/dots is accepted and trimmed; email is stored lower-case; response never contains the password; no token is issued (client must log in) | 200 | - |
        | Body empty, truncated or not valid JSON | 400 | `INVALID_JSON` |
        | Content-Type is not application/json | 400 | `UNSUPPORTED_CONTENT_TYPE` |
        | Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid | 422 | `VALIDATION_ERROR` |
        | Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id) | 422 | `UNKNOWN_FIELD` |
        | Mobile not 01[3-9]XXXXXXXX (Bangla digits, +880 prefix, spaces, hyphens rejected) | 422 | `MOBILE_INVALID` |
        | Password shorter than 8 or longer than 128 characters | 422 | `PASSWORD_LENGTH` |
        | Password is only whitespace or equals the mobile number / email | 422 | `PASSWORD_TOO_WEAK` |
        | Mobile already registered (also when two requests race: unique constraint decides) | 422 | `MOBILE_ALREADY_REGISTERED` |
        | Email already registered (compared case-insensitively) | 422 | `EMAIL_ALREADY_REGISTERED` |
        | Email malformed or longer than 254 characters | 422 | `EMAIL_INVALID` |
        | Database unavailable; account was not created | 500 | `UPSTREAM_UNAVAILABLE` |
        | Unexpected server error; nothing was saved (retryable=true) | 500 | `INTERNAL_ERROR` |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Success (see 200 rows above for special outcomes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: 'Request rejected: cannot be accepted as sent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_JSON:
                  summary: Body empty, truncated or not valid JSON
                  value:
                    code: INVALID_JSON
                    message: Body empty, truncated or not valid JSON
                    request_id: req_001
                UNSUPPORTED_CONTENT_TYPE:
                  summary: Content-Type is not application/json
                  value:
                    code: UNSUPPORTED_CONTENT_TYPE
                    message: Content-Type is not application/json
                    request_id: req_002
        '422':
          description: Well-formed but failed validation or a business rule; nothing is saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid
                  value:
                    code: VALIDATION_ERROR
                    message: Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid
                    request_id: req_003
                UNKNOWN_FIELD:
                  summary: Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id)
                  value:
                    code: UNKNOWN_FIELD
                    message: Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id)
                    request_id: req_004
                MOBILE_INVALID:
                  summary: Mobile not 01[3-9]XXXXXXXX (Bangla digits, +880 prefix, spaces, hyphens rejected)
                  value:
                    code: MOBILE_INVALID
                    message: Mobile not 01[3-9]XXXXXXXX (Bangla digits, +880 prefix, spaces, hyphens rejected)
                    request_id: req_005
                PASSWORD_LENGTH:
                  summary: Password shorter than 8 or longer than 128 characters
                  value:
                    code: PASSWORD_LENGTH
                    message: Password shorter than 8 or longer than 128 characters
                    request_id: req_006
                PASSWORD_TOO_WEAK:
                  summary: Password is only whitespace or equals the mobile number / email
                  value:
                    code: PASSWORD_TOO_WEAK
                    message: Password is only whitespace or equals the mobile number / email
                    request_id: req_007
                MOBILE_ALREADY_REGISTERED:
                  summary: 'Mobile already registered (also when two requests race: unique constraint decides)'
                  value:
                    code: MOBILE_ALREADY_REGISTERED
                    message: 'Mobile already registered (also when two requests race: unique constraint decides)'
                    request_id: req_008
                EMAIL_ALREADY_REGISTERED:
                  summary: Email already registered (compared case-insensitively)
                  value:
                    code: EMAIL_ALREADY_REGISTERED
                    message: Email already registered (compared case-insensitively)
                    request_id: req_009
                EMAIL_INVALID:
                  summary: Email malformed or longer than 254 characters
                  value:
                    code: EMAIL_INVALID
                    message: Email malformed or longer than 254 characters
                    request_id: req_010
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Log in with mobile/email + password (FR-AUTH-02)
      description: |
        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | +8801712345678 / 8801712345678 normalised to 01712345678; email case-insensitive; password with spaces/emoji/Bangla accepted as typed | 200 | - |
        | Successful login resets the failure counter, sets last_login, and user.has_shop=false tells the client to open shop setup | 200 | - |
        | Body empty, truncated or not valid JSON | 400 | `INVALID_JSON` |
        | Content-Type is not application/json | 400 | `UNSUPPORTED_CONTENT_TYPE` |
        | Wrong password OR unknown identifier (identical message, prevents account enumeration) | 400 | `INVALID_CREDENTIALS` |
        | Account deactivated | 400 | `ACCOUNT_INACTIVE` |
        | 5 consecutive failures lock the account for 15 min (details.retry_after_seconds); also counted for unknown identifiers | 400 | `ACCOUNT_LOCKED` |
        | Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid | 422 | `VALIDATION_ERROR` |
        | Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id) | 422 | `UNKNOWN_FIELD` |
        | Identifier is neither a valid mobile nor an email, or longer than 254 characters | 422 | `IDENTIFIER_INVALID` |
        | Mobile typed with Bangla digits | 422 | `MOBILE_BANGLA_DIGITS` |
        | Password shorter than 8 or longer than 128 characters | 422 | `PASSWORD_LENGTH` |
        | Unexpected server error; nothing was saved (retryable=true) | 500 | `INTERNAL_ERROR` |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success (see 200 rows above for special outcomes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 'Request rejected: cannot be accepted as sent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_JSON:
                  summary: Body empty, truncated or not valid JSON
                  value:
                    code: INVALID_JSON
                    message: Body empty, truncated or not valid JSON
                    request_id: req_011
                UNSUPPORTED_CONTENT_TYPE:
                  summary: Content-Type is not application/json
                  value:
                    code: UNSUPPORTED_CONTENT_TYPE
                    message: Content-Type is not application/json
                    request_id: req_012
                INVALID_CREDENTIALS:
                  summary: Wrong password OR unknown identifier (identical message, prevents account enumeration)
                  value:
                    code: INVALID_CREDENTIALS
                    message: Wrong password OR unknown identifier (identical message, prevents account enumeration)
                    request_id: req_013
                ACCOUNT_INACTIVE:
                  summary: Account deactivated
                  value:
                    code: ACCOUNT_INACTIVE
                    message: Account deactivated
                    request_id: req_014
                ACCOUNT_LOCKED:
                  summary: 5 consecutive failures lock the account for 15 min (details.retry_after_seconds); also counted for unknown identifiers
                  value:
                    code: ACCOUNT_LOCKED
                    message: 5 consecutive failures lock the account for 15 min (details.retry_after_seconds); also counted for unknown identifiers
                    request_id: req_015
        '422':
          description: Well-formed but failed validation or a business rule; nothing is saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid
                  value:
                    code: VALIDATION_ERROR
                    message: Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid
                    request_id: req_016
                UNKNOWN_FIELD:
                  summary: Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id)
                  value:
                    code: UNKNOWN_FIELD
                    message: Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id)
                    request_id: req_017
                IDENTIFIER_INVALID:
                  summary: Identifier is neither a valid mobile nor an email, or longer than 254 characters
                  value:
                    code: IDENTIFIER_INVALID
                    message: Identifier is neither a valid mobile nor an email, or longer than 254 characters
                    request_id: req_018
                MOBILE_BANGLA_DIGITS:
                  summary: Mobile typed with Bangla digits
                  value:
                    code: MOBILE_BANGLA_DIGITS
                    message: Mobile typed with Bangla digits
                    request_id: req_019
                PASSWORD_LENGTH:
                  summary: Password shorter than 8 or longer than 128 characters
                  value:
                    code: PASSWORD_LENGTH
                    message: Password shorter than 8 or longer than 128 characters
                    request_id: req_020
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password-reset/request:
    post:
      tags:
      - Auth
      operationId: requestPasswordReset
      summary: Request a password reset OTP (FR-AUTH-03)
      description: |
        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | Identical 200 whether or not the account exists or is active (anti-enumeration); no SMS is sent for unknown/inactive accounts | 200 | - |
        | A new request invalidates the previous OTP; OTP is 6 digits, valid 5 minutes, single use | 200 | - |
        | Body empty, truncated or not valid JSON | 400 | `INVALID_JSON` |
        | Content-Type is not application/json | 400 | `UNSUPPORTED_CONTENT_TYPE` |
        | More than 3 requests per mobile per hour (429 is not used) | 400 | `TOO_MANY_REQUESTS` |
        | Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid | 422 | `VALIDATION_ERROR` |
        | Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id) | 422 | `UNKNOWN_FIELD` |
        | Mobile not 01[3-9]XXXXXXXX (Bangla digits, +880 prefix, spaces, hyphens rejected) | 422 | `MOBILE_INVALID` |
        | SMS provider down; no OTP was issued | 500 | `UPSTREAM_UNAVAILABLE` |
        | Unexpected server error; nothing was saved (retryable=true) | 500 | `INTERNAL_ERROR` |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: Success (see 200 rows above for special outcomes)
        '400':
          description: 'Request rejected: cannot be accepted as sent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_JSON:
                  summary: Body empty, truncated or not valid JSON
                  value:
                    code: INVALID_JSON
                    message: Body empty, truncated or not valid JSON
                    request_id: req_021
                UNSUPPORTED_CONTENT_TYPE:
                  summary: Content-Type is not application/json
                  value:
                    code: UNSUPPORTED_CONTENT_TYPE
                    message: Content-Type is not application/json
                    request_id: req_022
                TOO_MANY_REQUESTS:
                  summary: More than 3 requests per mobile per hour (429 is not used)
                  value:
                    code: TOO_MANY_REQUESTS
                    message: More than 3 requests per mobile per hour (429 is not used)
                    request_id: req_023
        '422':
          description: Well-formed but failed validation or a business rule; nothing is saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                VALIDATION_ERROR:
                  summary: Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid
                  value:
                    code: VALIDATION_ERROR
                    message: Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid
                    request_id: req_024
                UNKNOWN_FIELD:
                  summary: Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id)
                  value:
                    code: UNKNOWN_FIELD
                    message: Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id)
                    request_id: req_025
                MOBILE_INVALID:
                  summary: Mobile not 01[3-9]XXXXXXXX (Bangla digits, +880 prefix, spaces, hyphens rejected)
                  value:
                    code: MOBILE_INVALID
                    message: Mobile not 01[3-9]XXXXXXXX (Bangla digits, +880 prefix, spaces, hyphens rejected)
                    request_id: req_026
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/password-reset/confirm:
    post:
      tags:
      - Auth
      operationId: confirmPasswordReset
      summary: Confirm OTP and set a new password (FR-AUTH-03)
      description: |
        ### Edge cases
        | Case | Status | `code` |
        |---|---|---|
        | Password updated, OTP consumed, all existing sessions/refresh tokens revoked, failed-login lock cleared | 200 | - |
        | Body empty, truncated or not valid JSON | 400 | `INVALID_JSON` |
        | Content-Type is not application/json | 400 | `UNSUPPORTED_CONTENT_TYPE` |
        | OTP wrong, expired, already used, or never requested for this mobile (same message for all) | 400 | `OTP_INVALID` |
        | 5 wrong OTP attempts invalidate the OTP; a new one must be requested | 400 | `TOO_MANY_ATTEMPTS` |
        | Required field missing/null/wrong type, blank after trimming, over max length, or enum value invalid | 422 | `VALIDATION_ERROR` |
        | Unknown or read-only property in body (e.g. current_stock, due_amount, shop_id) | 422 | `UNKNOWN_FIELD` |
        | Mobile not 01[3-9]XXXXXXXX (Bangla digits, +880 prefix, spaces, hyphens rejected) | 422 | `MOBILE_INVALID` |
        | Password shorter than 8 or longer than 128 characters | 422 | `PASSWORD_LENGTH` |
        | Password is only whitespace or equals the mobile number / email | 422 | `PASSWORD_TOO_WEAK` |
        | otp is not exactly 6 English digits | 422 | `OTP_FORMAT` |
        | Unexpected server error; nothing was saved (retryable=true) | 500 | `INTERNAL_ERROR` |
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
      responses:
        '200':
          description: Success (see 200 rows above for special outcomes)
        '400':
          description: 'Request rejected: cannot be accepted as sent'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_JSON:
                  summary: Body empty, truncated or not valid JSON
                  value:
                    code: INVALID_JSON
                    message: Body empty, truncated or not valid JSON
                    request_id: req_027
                UNSUPPORTED_CONTENT_TYPE:
                  summary: Content-Type is not application/json
                  value:
                    code: UNSUPPORTED_CONTENT_TYPE
                    message: Content-Type is not application/json
                    request_id: req_028
                OTP_INVALID:
                  summary: OTP wrong, expired, already used, or never requested for this mobile (same message for all)
                  value:
                    code: OTP_INVALID
                    message: OTP wrong, expired, already used, or never requested for this mobile (same message for all)
                    request_id: req_029
                TOO_MANY_ATTEMPTS:
                  summary: 5 wrong OTP attempts invalidate the OTP; a new one must be requested
                  value:
                    code: TOO_MANY_ATTEMPTS
                    message: 5 wrong OTP attempts invalidate the OTP; a new one must be requested
                    request_id: req_030
        '422':
          description: Well-formed but failed validation or a business rule; nothing is saved
          content:
            application/json:
              schema:
